spring:
  application:
    name: bookingsystem

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:temporary-booking-system-secret-key-2026-change-this}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  seed:
    admin:
      username: ${SEED_ADMIN_USERNAME:practice-admin}
      email: ${SEED_ADMIN_EMAIL:practice-admin@example.com}
      password: ${SEED_ADMIN_PASSWORD:Admin@123}

    user:
      username: ${SEED_USER_USERNAME:practice-user}
      email: ${SEED_USER_EMAIL:practice-user@example.com}
      password: ${SEED_USER_PASSWORD:User@123}

    user2:
      username: ${SEED_USER2_USERNAME:practice-user-2}
      email: ${SEED_USER2_EMAIL:practice-user-2@example.com}
      password: ${SEED_USER2_PASSWORD:User2@123}